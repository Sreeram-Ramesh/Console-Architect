[project]
name = "console-architect"
version = "0.1.0"
description = "Terminal-native memory/storage architecture simulator game for chip designers"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "textual>=0.80"]

[project.optional-dependencies]
telemetry = ["psutil"]
vcd = ["pyvcd"]

[dependency-groups]
dev = ["pytest", "hypothesis", "pytest-timeout"]

[project.scripts]
ca = "console_architect.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["console_architect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
